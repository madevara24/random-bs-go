name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Build, Vet, Lint, Test
    runs-on: ubuntu-latest
    env:
      RBG_TEST_VAULT_PATH: /tmp/rbg-test-vault-ci
      RBG_TEST_TARGET_REPO_PATH: /tmp/rbg-test-target-ci
      GIT_AUTHOR_NAME: rbg-ci
      GIT_AUTHOR_EMAIL: rbg-ci@users.noreply.github.com
      GIT_COMMITTER_NAME: rbg-ci
      GIT_COMMITTER_EMAIL: rbg-ci@users.noreply.github.com
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

      - name: Build test fixture
        run: make test-fixture

      - name: Test
        run: go test ./...
